<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: #060606; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: #f2f2f2;
    background:
      radial-gradient(600px 400px at 88% 12%, rgba(200,255,62,0.16), transparent 70%),
      radial-gradient(500px 360px at 0% 100%, rgba(200,255,62,0.07), transparent 70%),
      #060606;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(900px 500px at 70% 30%, #000, transparent 85%);
  }
  .wrap { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; }
  /* Logo tile: lighter fill + accent border so it separates from the background */
  .tile {
    width: 132px; height: 132px; border-radius: 30px;
    background: linear-gradient(160deg, #1a1a1a, #0e0e0e);
    border: 3px solid rgba(200,255,62,0.55);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 48px rgba(200,255,62,0.22);
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 66px; letter-spacing: -2px;
    color: #f2f2f2;
  }
  .tile span, .accent { color: #c8ff3e; }
  h1 { margin-top: auto; font-size: 76px; line-height: 1; font-weight: 700; letter-spacing: -2.5px; }
  p { margin-top: 22px; font-size: 32px; line-height: 1.3; color: #a7a7a7; max-width: 900px; }
  .tags { margin-top: 34px; display: flex; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; }
  .tags span { padding: 8px 16px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; color: #d6d6d6; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="tile"><div>b<span>.</span></div></div>
    <h1>Bharat<span class="accent">.</span> Full-Stack Developer</h1>
    <p>Building reliable, scalable and user-friendly web applications.</p>
    <div class="tags"><span>Node.js</span><span>TypeScript</span><span>React</span><span>MongoDB</span><span>Shopify</span></div>
  </div>
</body>
</html>
