<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=block" rel="stylesheet" />
<style>
  * { margin: 0; }
  html, body { width: 512px; height: 512px; background: transparent; }
  /* Full-bleed square so it survives maskable/circle crops; border keeps it visible on dark UIs */
  .tile {
    width: 512px; height: 512px; border-radius: 112px; box-sizing: border-box;
    background: linear-gradient(160deg, #1a1a1a, #0b0b0b);
    border: 14px solid rgba(200,255,62,0.6);
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 270px; letter-spacing: -8px;
    color: #f2f2f2; padding-bottom: 18px;
  }
  .tile span { color: #c8ff3e; }
</style>
</head>
<body><div class="tile"><div>b<span>.</span></div></div></body>
</html>
